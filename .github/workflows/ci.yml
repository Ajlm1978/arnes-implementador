name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SKILL_DIR: skill/arnes-implementador
  DIST_FILE: dist/arnes-implementador.skill

jobs:
  validate:
    name: Validar y empaquetar skill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyYAML
        run: python -m pip install --disable-pip-version-check "pyyaml>=6,<7"

      - name: Frontmatter + límites (name, description <= 1024, SKILL.md < 500 líneas)
        run: python -I scripts/validate_skill.py "$SKILL_DIR"

      - name: bash -n sobre scripts de plantilla
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            found=1
            echo "bash -n $f"
            bash -n "$f"
          done < <(find "$SKILL_DIR/assets/templates" -name '*.sh' -print0)
          [ "$found" = 1 ] || { echo "No se encontró ningún *.sh en assets/templates"; exit 1; }

      - name: shellcheck (advertencias no bloquean; errores sí)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          find "$SKILL_DIR/assets/templates" -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=error

      - name: JSON válido en plantillas
        run: |
          set -euo pipefail
          find "$SKILL_DIR" -name '*.json' -print0 | while IFS= read -r -d '' f; do
            echo "json: $f"
            python -I -m json.tool "$f" >/dev/null
          done

      - name: Reempaquetar y comparar contenido con dist/
        run: python -I scripts/validate_skill.py "$SKILL_DIR" --check "$DIST_FILE"

      - name: Empaquetar artefacto de CI (para inspección manual)
        run: python -I scripts/validate_skill.py "$SKILL_DIR" --package ci-dist

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: arnes-implementador-skill-${{ github.sha }}
          path: ci-dist/arnes-implementador.skill
          if-no-files-found: error
          retention-days: 14

  changelog-and-version:
    name: Versión coherente (frontmatter, CHANGELOG, plugin.json)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "pyyaml>=6,<7"
      - name: metadata.version == última entrada de CHANGELOG.md
        run: |
          set -euo pipefail
          fm_ver=$(python -I - <<'PY'
          import re, yaml
          t = open("skill/arnes-implementador/SKILL.md", encoding="utf-8").read()
          fm = yaml.safe_load(re.match(r"^---\n(.*?)\n---", t, re.S).group(1))
          print((fm.get("metadata") or {}).get("version", ""))
          PY
          )
          cl_ver=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          pj_ver=$(python -I -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          echo "frontmatter=$fm_ver changelog=$cl_ver plugin.json=$pj_ver"
          [ -n "$fm_ver" ] || { echo "Falta metadata.version en SKILL.md"; exit 1; }
          [ "$fm_ver" = "$cl_ver" ] || { echo "metadata.version ($fm_ver) != CHANGELOG ($cl_ver)"; exit 1; }
          [ "$fm_ver" = "$pj_ver" ] || { echo "metadata.version ($fm_ver) != .claude-plugin/plugin.json ($pj_ver): sin bump, 'claude plugin update' deja a los usuarios en la versión vieja"; exit 1; }

  plugin-validate:
    name: claude plugin validate --strict (plugin + marketplace)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.300   # pineado: la salida/CLI cambia entre versiones
      - name: Validar marketplace.json y plugin.json
        run: |
          set -euo pipefail
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
      - name: Instalación real desde marketplace local
        run: |
          set -euo pipefail
          claude plugin marketplace add "$PWD"
          claude plugin install arnes-implementador@ajlm1978
          ver=$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          claude plugin list --json | python3 -c '
          import json, sys
          want = sys.argv[1]
          p = [x for x in json.load(sys.stdin) if x.get("id") == "arnes-implementador@ajlm1978"]
          assert p, "plugin no instalado"
          assert p[0].get("enabled"), "plugin instalado pero no enabled"
          assert p[0].get("version") == want, f"version instalada {p[0].get(chr(118)+chr(101)+chr(114)+chr(115)+chr(105)+chr(111)+chr(110))} != {want}"
          print("instalado y enabled:", p[0]["id"], p[0]["version"])
          ' "$ver"
